name: daily

on:
  schedule:
    - cron: "17 4 * * *"    # ~06:17 Danish time (GitHub often starts scheduled runs hours late)
    - cron: "41 16 * * *"   # backup: only collects shops that don't have today's data yet
  push:
    branches: [main]
    paths: ["data/**", "site-src/**", "collector/build_site.py"]
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N targets per shop (testing)"
        required: false
        default: ""
      skip_collect:
        description: "Only rebuild and deploy the site"
        type: boolean
        default: false
      shops:
        description: "Comma-separated shops to collect (default: all CI shops)"
        required: false
        default: ""

# GitHub keeps one running and one pending run per group, and a new run replaces the pending one. So collection
# runs (schedule, dispatch) get a group of their own: a data push from a session (deploy only) must never replace
# a collection that is waiting its turn. Page deploys are serialised separately (job-level group below).
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy' || 'collect' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_collect)
    runs-on: ubuntu-latest
    outputs:
      shops: ${{ steps.list.outputs.shops }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, "collector")
          from shops import SHOPS
          wanted = [s.strip() for s in "${{ inputs.shops }}".split(",") if s.strip()]
          shops = wanted or [n for n, c in SHOPS.items() if c.get("ci") is not False]
          print("shops=" + json.dumps(shops))
          PY

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shop: ${{ fromJson(needs.plan.outputs.shops) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh targets (Mondays, or if missing)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -s collector/targets/${{ matrix.shop }}.txt ]; then
            python collector/targets.py ${{ matrix.shop }}
          fi
      - name: Collect prices
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python collector/collect.py --limit "${{ inputs.limit }}" ${{ matrix.shop }}
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python collector/collect.py --skip-existing ${{ matrix.shop }}
          else
            python collector/collect.py ${{ matrix.shop }}
          fi
      - name: Commit data
        run: |
          git config user.name "plumtab-bot"
          git config user.email "plumtab.studio@gmail.com"
          git add data collector/targets collector/catalog
          git commit -q -m "data: ${{ matrix.shop }} $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: |
          python collector/build_site.py --out _site
          cp -r site-src/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
